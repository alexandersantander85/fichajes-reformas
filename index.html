<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FICHAOBRA — Registro de jornada</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#080d14;
  --panel:#101823;
  --panel2:#151f2d;
  --border:#263548;
  --text:#eef5ff;
  --muted:#91a0b5;
  --accent:#4df3b0;
  --accent2:#5db7ff;
  --danger:#ff637d;
  --warning:#ffc857;
  --success:#43e59b;
  --shadow:0 18px 50px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(circle at top,#142235 0,#080d14 48%);
  color:var(--text);
  font-family:Inter,Segoe UI,Arial,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{min-height:100vh}
.topbar{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  border-bottom:1px solid var(--border);
  background:rgba(8,13,20,.86);
  backdrop-filter:blur(14px);
  position:sticky;
  top:0;
  z-index:20;
}
.brand{font-weight:900;letter-spacing:.08em}
.brand span{color:var(--accent)}
.userbox{display:flex;align-items:center;gap:12px;color:var(--muted)}
.container{max-width:1400px;margin:auto;padding:28px}
.grid{display:grid;gap:18px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{
  background:linear-gradient(180deg,rgba(21,31,45,.96),rgba(14,22,32,.96));
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  box-shadow:var(--shadow);
}
.card h2,.card h3{margin:0 0 14px}
.muted{color:var(--muted)}
.small{font-size:12px}
.kpi{font-size:30px;font-weight:900;margin-top:6px}
.kpi-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.status{
  display:inline-flex;
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}
.status.ok{background:rgba(67,229,155,.12);color:var(--success)}
.status.warn{background:rgba(255,200,87,.12);color:var(--warning)}
.status.bad{background:rgba(255,99,125,.12);color:var(--danger)}
.status.info{background:rgba(93,183,255,.12);color:var(--accent2)}
.btn{
  border:1px solid var(--border);
  background:#182536;
  color:var(--text);
  padding:10px 14px;
  border-radius:11px;
  font-weight:800;
}
.btn:hover{filter:brightness(1.12)}
.btn.primary{background:var(--accent);color:#06120d;border-color:var(--accent)}
.btn.danger{background:rgba(255,99,125,.12);color:var(--danger);border-color:rgba(255,99,125,.35)}
.btn.success{background:rgba(67,229,155,.12);color:var(--success);border-color:rgba(67,229,155,.35)}
.btn.blue{background:rgba(93,183,255,.12);color:var(--accent2);border-color:rgba(93,183,255,.35)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:7px}
label{font-size:12px;color:var(--muted);font-weight:700}
input,select,textarea{
  width:100%;
  background:#0b131e;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:10px;
  padding:11px 12px;
  outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent2)}
textarea{min-height:90px;resize:vertical}
.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}
.login-card{width:min(440px,100%)}
.logo{
  width:54px;height:54px;border-radius:16px;
  display:grid;place-items:center;
  background:var(--accent);color:#07130d;font-weight:1000;
  margin-bottom:16px;
}
.login-card h1{margin:0 0 7px}
.login-card .field{margin-top:14px}
.login-card .btn{width:100%;margin-top:18px}
.error{
  margin-top:12px;
  padding:10px 12px;
  border-radius:10px;
  background:rgba(255,99,125,.1);
  color:var(--danger);
  font-size:13px;
}
.employee-actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.punch{
  min-height:92px;
  border:1px solid var(--border);
  border-radius:15px;
  background:#111c29;
  color:var(--text);
  font-weight:900;
}
.punch strong{display:block;font-size:16px;margin-top:5px}
.punch.green{border-color:rgba(67,229,155,.4)}
.punch.yellow{border-color:rgba(255,200,87,.4)}
.punch.blue{border-color:rgba(93,183,255,.4)}
.punch.red{border-color:rgba(255,99,125,.4)}
.tabs{
  display:flex;gap:7px;flex-wrap:wrap;
  margin-bottom:18px;
}
.tab{
  padding:9px 13px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0d1621;
  color:var(--muted);
  font-weight:800;
}
.tab.active{color:var(--text);border-color:var(--accent);background:rgba(77,243,176,.08)}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:11px 10px;border-bottom:1px solid var(--border);text-align:left;font-size:13px;vertical-align:top}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
tr:hover td{background:rgba(255,255,255,.018)}
.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:16px}
.toolbar .field{min-width:150px;flex:1}
.toolbar .field.small-field{max-width:170px}
.toastbox{
  position:fixed;right:20px;bottom:20px;z-index:100;
  display:flex;flex-direction:column;gap:8px;max-width:380px;
}
.toast{
  padding:13px 15px;border-radius:12px;
  border:1px solid var(--border);
  background:#111b27;box-shadow:var(--shadow);
}
.toast.ok{border-color:rgba(67,229,155,.4)}
.toast.err{border-color:rgba(255,99,125,.4)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.report-header{
  display:flex;justify-content:space-between;gap:15px;align-items:flex-start;
  margin-bottom:18px;
}
.report-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.report-kpi{padding:15px;border:1px solid var(--border);border-radius:13px;background:#0c1520}
.report-kpi .value{font-size:23px;font-weight:900;margin-top:5px}
.report-table td,.report-table th{font-size:12px}
.anomaly{color:var(--danger);font-size:11px;margin-top:4px}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  display:grid;place-items:center;padding:20px;z-index:80;
}
.modal-card{width:min(900px,100%);max-height:90vh;overflow:auto}
.close{float:right}
.print-only{display:none}
#reportChart{max-height:320px}
@media(max-width:1000px){
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr 1fr}
  .report-kpis{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:700px){
  .container{padding:16px}
  .topbar{padding:0 15px}
  .employee-actions{grid-template-columns:1fr 1fr}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr}
  .report-kpis{grid-template-columns:1fr 1fr}
}
@media print{
  body{background:#fff;color:#111}
  .no-print,.topbar,.tabs,.toolbar,#reportChartWrap{display:none!important}
  .print-only{display:block}
  .card{box-shadow:none;border:0;padding:0}
  .container{max-width:none;padding:0}
  table{min-width:0}
  th,td{border-color:#ccc;color:#111}
}
</style>
</head>

<body>
<div id="loginView" class="login">
  <div class="card login-card">
    <div class="logo">FO</div>
    <h1>FICHA<span style="color:var(--accent)">OBRA</span></h1>
    <div class="muted">Registro de jornada</div>

    <div class="field">
      <label>Usuario</label>
      <input id="loginUsuario" autocomplete="username">
    </div>

    <div class="field">
      <label>Contraseña</label>
      <input id="loginPassword" type="password" autocomplete="current-password">
    </div>

    <button class="btn primary" onclick="iniciarSesion()">Entrar</button>
    <div id="loginError" class="error hidden"></div>
  </div>
</div>

<div id="appView" class="app hidden">
  <header class="topbar">
    <div class="brand">FICHA<span>OBRA</span></div>
    <div class="userbox">
      <span id="topUser"></span>
      <span id="topRole" class="status info"></span>
      <button class="btn" onclick="cerrarSesion()">Salir</button>
    </div>
  </header>

  <main class="container">
    <section id="empleadoView" class="hidden">
      <div class="grid grid-2">
        <div class="card">
          <h2>Jornada de hoy</h2>
          <div id="estadoHoy" class="status info">Cargando...</div>
          <div class="grid grid-2" style="margin-top:18px">
            <div>
              <div class="kpi-label">Trabajado</div>
              <div id="horasHoy" class="kpi">0.00 h</div>
            </div>
            <div>
              <div class="kpi-label">Pausa</div>
              <div id="pausaHoy" class="kpi">0.00 h</div>
            </div>
          </div>
        </div>

        <div class="card">
          <h2>Obra asignada</h2>
          <div id="miObra">Cargando...</div>
        </div>
      </div>

      <div class="card" style="margin-top:18px">
        <h2>Fichar</h2>
        <p class="muted small">La ubicación se obtiene desde el navegador al realizar el fichaje.</p>

        <div class="employee-actions">
          <button id="btnEntrada" class="punch green" onclick="hacerFichaje('entrada')">
            ENTRADA<strong>▶</strong>
          </button>
          <button id="btnPausaInicio" class="punch yellow" onclick="hacerFichaje('pausa_inicio')">
            PAUSA<strong>Ⅱ</strong>
          </button>
          <button id="btnPausaFin" class="punch blue" onclick="hacerFichaje('pausa_fin')">
            FIN PAUSA<strong>▶</strong>
          </button>
          <button id="btnSalida" class="punch red" onclick="hacerFichaje('salida')">
            SALIDA<strong>■</strong>
          </button>
        </div>

        <div id="fichajesHoy" style="margin-top:18px"></div>
      </div>

      <div class="grid grid-2" style="margin-top:18px">
        <div class="card">
          <h2>Solicitar corrección</h2>
          <div class="grid grid-2">
            <div class="field">
              <label>Fecha</label>
              <input id="corrFecha" type="date">
            </div>
            <div class="field">
              <label>Tipo</label>
              <select id="corrTipo">
                <option value="entrada">Entrada</option>
                <option value="pausa_inicio">Inicio de pausa</option>
                <option value="pausa_fin">Fin de pausa</option>
                <option value="salida">Salida</option>
              </select>
            </div>
          </div>
          <div class="grid grid-2" style="margin-top:12px">
            <div class="field">
              <label>Hora</label>
              <input id="corrHora" type="time">
            </div>
            <div class="field">
              <label>Motivo</label>
              <input id="corrMotivo" placeholder="Ej. olvidé fichar la salida">
            </div>
          </div>
          <button class="btn primary" style="margin-top:14px" onclick="enviarCorreccion()">Enviar solicitud</button>
        </div>

        <div class="card">
          <h2>Mis solicitudes</h2>
          <div id="misCorrecciones"></div>
        </div>
      </div>

      <div class="card" style="margin-top:18px">
        <h2>Notificaciones</h2>
        <div id="misNotificaciones"></div>
      </div>
    </section>

    <section id="adminView" class="hidden">
      <div class="tabs no-print">
        <button class="tab active" data-tab="equipo" onclick="cambiarAdminTab('equipo')">Equipo</button>
        <button class="tab" data-tab="obras" onclick="cambiarAdminTab('obras')">Obras</button>
        <button class="tab" data-tab="correcciones" onclick="cambiarAdminTab('correcciones')">Correcciones</button>
        <button class="tab" data-tab="informes" onclick="cambiarAdminTab('informes')">Informes</button>
        <button class="tab" data-tab="auditoria" onclick="cambiarAdminTab('auditoria')">Auditoría</button>
      </div>

      <div id="admin-equipo" class="admin-tab"></div>
      <div id="admin-obras" class="admin-tab hidden"></div>
      <div id="admin-correcciones" class="admin-tab hidden"></div>
      <div id="admin-informes" class="admin-tab hidden"></div>
      <div id="admin-auditoria" class="admin-tab hidden"></div>
    </section>
  </main>
</div>

<div id="toastbox" class="toastbox"></div>

<div id="modal" class="modal hidden" onclick="cerrarModal(event)">
  <div class="card modal-card" onclick="event.stopPropagation()">
    <button class="btn close" onclick="cerrarModal()">Cerrar</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxxc_tXI2gFx7zkQgmgP5sLR5rnio2ZijODWNw7JNPWvbrRu5JENpudkbGIX_X4VS-g/exec';
const SESSION_KEY = 'sesionFichajes';

let sesion = null;
let empleados = [];
let obras = [];
let correcciones = [];
let auditoria = [];
let informeActual = null;
let chart = null;
let adminTabLoaded = {};

function $(id){ return document.getElementById(id); }

function escapeHtml(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function mostrarToast(msg, tipo='ok'){
  const box = $('toastbox');
  const el = document.createElement('div');
  el.className = 'toast ' + (tipo === 'err' ? 'err' : 'ok');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>el.remove(),4200);
}

async function api(action, extra={}){
  const payload = Object.assign({action, token: sesion ? sesion.token : ''}, extra);

  const response = await fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)
  });

  const json = await response.json();

  if(!json.ok) throw new Error(json.error || 'Error del servidor');
  return json.data;
}

function guardarSesion(){
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(sesion));
}

function cargarSesion(){
  try{
    const raw = sessionStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

async function iniciarSesion(){
  $('loginError').classList.add('hidden');

  try{
    const usuario = $('loginUsuario').value.trim();
    const password = $('loginPassword').value;

    if(!usuario || !password) throw new Error('Introduce usuario y contraseña');

    const payload = {
      action:'login',
      usuario,
      password
    };

    const response = await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)
    });

    const json = await response.json();
    if(!json.ok) throw new Error(json.error || 'No se pudo iniciar sesión');

    sesion = json.data;
    guardarSesion();
    mostrarApp();
  }catch(e){
    $('loginError').textContent = e.message;
    $('loginError').classList.remove('hidden');
  }
}

async function cerrarSesion(){
  try{
    if(sesion) await api('logout');
  }catch(e){}
  sessionStorage.removeItem(SESSION_KEY);
  sesion = null;
  $('appView').classList.add('hidden');
  $('loginView').classList.remove('hidden');
}

function mostrarApp(){
  $('loginView').classList.add('hidden');
  $('appView').classList.remove('hidden');

  $('topUser').textContent = sesion.nombre || sesion.empleadoId;
  $('topRole').textContent = sesion.rol === 'admin' ? 'Administrador' : 'Empleado';

  if(sesion.rol === 'admin'){
    $('empleadoView').classList.add('hidden');
    $('adminView').classList.remove('hidden');
    cargarAdminInicial();
  }else{
    $('adminView').classList.add('hidden');
    $('empleadoView').classList.remove('hidden');
    cargarEmpleado();
  }
}

async function cargarEmpleado(){
  $('corrFecha').value = new Date().toISOString().slice(0,10);

  try{
    await Promise.all([
      cargarResumenHoy(),
      cargarMiObra(),
      cargarMisCorrecciones(),
      cargarNotificaciones()
    ]);
  }catch(e){
    mostrarToast(e.message,'err');
  }
}

async function cargarResumenHoy(){
  const r = await api('resumenHoy');

  const estadoTexto = {
    SIN_FICHAR:'Sin fichar',
    TRABAJANDO:'Trabajando',
    EN_PAUSA:'En pausa',
    FINALIZADO:'Jornada finalizada'
  }[r.estado] || r.estado;

  $('estadoHoy').textContent = estadoTexto;
  $('estadoHoy').className = 'status ' + (
    r.estado === 'TRABAJANDO' ? 'ok' :
    r.estado === 'EN_PAUSA' ? 'warn' :
    r.estado === 'FINALIZADO' ? 'info' : 'bad'
  );

  $('horasHoy').textContent = Number(r.horasTrabajadas).toFixed(2) + ' h';
  $('pausaHoy').textContent = Number(r.horasPausa).toFixed(2) + ' h';

  actualizarBotones(r.estado);

  $('fichajesHoy').innerHTML = r.fichajesHoy.length
    ? '<div class="table-wrap"><table><thead><tr><th>Tipo</th><th>Hora</th><th>Ubicación</th></tr></thead><tbody>' +
      r.fichajesHoy.map(f =>
        '<tr><td>'+escapeHtml(etiqueta(f.tipo))+'</td><td>'+escapeHtml(f.hora)+'</td><td>' +
        (f.lat != null ? escapeHtml(Number(f.lat).toFixed(5)+', '+Number(f.lng).toFixed(5)) : '—') +
        '</td></tr>'
      ).join('') +
      '</tbody></table></div>'
    : '<div class="empty">Todavía no hay fichajes hoy.</div>';
}

function etiqueta(tipo){
  return {
    entrada:'Entrada',
    pausa_inicio:'Inicio de pausa',
    pausa_fin:'Fin de pausa',
    salida:'Salida'
  }[tipo] || tipo;
}

function actualizarBotones(estado){
  $('btnEntrada').disabled = estado !== 'SIN_FICHAR';
  $('btnPausaInicio').disabled = estado !== 'TRABAJANDO';
  $('btnPausaFin').disabled = estado !== 'EN_PAUSA';
  $('btnSalida').disabled = estado !== 'TRABAJANDO';
}

async function obtenerUbicacion(){
  if(!navigator.geolocation){
    throw new Error('Este navegador no permite obtener la ubicación.');
  }

  return new Promise((resolve,reject)=>{
    navigator.geolocation.getCurrentPosition(
      pos => resolve({
        lat:pos.coords.latitude,
        lng:pos.coords.longitude,
        precision:pos.coords.accuracy
      }),
      err => {
        const mensajes = {
          1:'Permiso de ubicación denegado.',
          2:'No se pudo obtener la ubicación.',
          3:'La ubicación tardó demasiado.'
        };
        reject(new Error(mensajes[err.code] || 'No se pudo obtener la ubicación.'));
      },
      {enableHighAccuracy:true,timeout:15000,maximumAge:0}
    );
  });
}

async function hacerFichaje(tipo){
  try{
    if(!confirm('¿Confirmar '+etiqueta(tipo).toLowerCase()+'?')) return;

    document.querySelectorAll('.punch').forEach(b=>b.disabled=true);

    const ubicacion = await obtenerUbicacion();

    await api('fichar',{
      tipo,
      lat:ubicacion.lat,
      lng:ubicacion.lng,
      precision:ubicacion.precision
    });

    mostrarToast(etiqueta(tipo)+' registrada correctamente');
    await cargarResumenHoy();
  }catch(e){
    mostrarToast(e.message,'err');
    await cargarResumenHoy().catch(()=>{});
  }
}

async function cargarMiObra(){
  const obra = await api('miObra');

  $('miObra').innerHTML = obra
    ? '<strong>'+escapeHtml(obra.nombre)+'</strong><div class="muted" style="margin-top:6px">'+escapeHtml(obra.direccion || 'Sin dirección')+'</div><div style="margin-top:8px"><span class="status ok">'+escapeHtml(obra.estado)+'</span></div>'
    : '<div class="empty">No tienes ninguna obra asignada.</div>';
}

async function enviarCorreccion(){
  try{
    const fecha = $('corrFecha').value;
    const tipoSolicitado = $('corrTipo').value;
    const horaSolicitada = $('corrHora').value;
    const motivo = $('corrMotivo').value.trim();

    await api('solicitarCorreccion',{
      fecha,tipoSolicitado,horaSolicitada,motivo
    });

    $('corrMotivo').value='';
    $('corrHora').value='';
    mostrarToast('Solicitud enviada');
    await cargarMisCorrecciones();
  }catch(e){
    mostrarToast(e.message,'err');
  }
}

async function cargarMisCorrecciones(){
  const data = await api('misCorrecciones');

  $('misCorrecciones').innerHTML = data.length
    ? '<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Hora</th><th>Estado</th><th>Respuesta</th></tr></thead><tbody>'+
      data.map(c =>
        '<tr><td>'+escapeHtml(c.fecha)+'</td><td>'+escapeHtml(etiqueta(c.tipoSolicitado))+'</td><td>'+escapeHtml(c.horaSolicitada)+'</td><td>'+estadoPill(c.estado)+'</td><td>'+escapeHtml(c.respuestaAdmin || '—')+'</td></tr>'
      ).join('')+
      '</tbody></table></div>'
    : '<div class="empty">No tienes solicitudes.</div>';
}

function estadoPill(estado){
  const cls =
    estado === 'aprobada' || estado === 'COMPLETA' ? 'ok' :
    estado === 'pendiente' || estado === 'INCOMPLETA' ? 'warn' : 'bad';
  return '<span class="status '+cls+'">'+escapeHtml(estado)+'</span>';

async function cargarAdminInicial(){

async function cambiarAdminTab(tab){
  document.querySelectorAll('.admin-tab').forEach(el=>el.classList.add('hidden'));
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));

  $('admin-'+tab).classList.remove('hidden');
  const button = document.querySelector('.tab[data-tab="'+tab+'"]');
  if(button) button.classList.add('active');

  if(adminTabLoaded[tab]) return;

  try{
    if(tab==='equipo') await cargarAdminEquipo();
    if(tab==='obras') await cargarAdminObras();
    if(tab==='correcciones') await cargarAdminCorrecciones();
    if(tab==='informes') await cargarAdminInformes();
    if(tab==='auditoria') await cargarAdminAuditoria();

    adminTabLoaded[tab]=true;
  }catch(e){
    mostrarToast(e.message,'err');
  }
}

async function cargarAdminCorrecciones(){
  correcciones=await api('adminListCorrecciones');

  $('admin-correcciones').innerHTML =
    '<div class="card">'+
      '<div class="toolbar">'+
        '<div class="field"><label>Filtrar estado</label><select id="corrFiltro" onchange="renderCorrecciones()"><option value="">Todas</option><option value="pendiente">Pendientes</option><option value="aprobada">Aprobadas</option><option value="rechazada">Rechazadas</option></select></div>'+
        '<div class="field"><label>Buscar</label><input id="corrBuscar" oninput="renderCorrecciones()" placeholder="Fecha, empleado, motivo"></div>'+
      '</div>'+
      '<div id="correccionesTabla"></div>'+
    '</div>';

  renderCorrecciones();
}

function renderCorrecciones(){
  const filtro=$('corrFiltro')?.value||'';
  const q=($('corrBuscar')?.value||'').toLowerCase();

  const rows=correcciones.filter(c=>{
    const emp=empleados.find(e=>e.id===c.empleadoId);
    const texto=(emp?.nombre||c.empleadoId)+' '+c.fecha+' '+c.motivo;
    return (!filtro||c.estado===filtro)&&(!q||texto.toLowerCase().includes(q));
  });

  $('correccionesTabla').innerHTML =
    '<div class="table-wrap"><table><thead><tr><th>Empleado</th><th>Fecha</th><th>Solicitud</th><th>Motivo</th><th>Estado</th><th>Acción</th></tr></thead><tbody>'+
    (rows.length ? rows.map(c=>{
      const emp=empleados.find(e=>e.id===c.empleadoId);
      return '<tr>'+
        '<td>'+escapeHtml(emp?.nombre||c.empleadoId)+'</td>'+
        '<td>'+escapeHtml(c.fecha)+'</td>'+
        '<td>'+escapeHtml(etiqueta(c.tipoSolicitado))+' · '+escapeHtml(c.horaSolicitada)+'</td>'+
        '<td>'+escapeHtml(c.motivo||'—')+'</td>'+
        '<td>'+estadoPill(c.estado)+'</td>'+
        '<td>'+(c.estado==='pendiente'
          ? '<div class="actions"><button class="btn success" onclick="resolverCorreccion(\''+c.id+'\',true)">Aprobar</button><button class="btn danger" onclick="resolverCorreccion(\''+c.id+'\',false)">Rechazar</button></div>'
          : escapeHtml(c.respuestaAdmin||'—'))+
      '</td></tr>';
    }).join('') : '<tr><td colspan="6" class="empty">No hay solicitudes.</td></tr>')+
    '</tbody></table></div>';
}

async function resolverCorreccion(id, aprobar){
  const respuesta=prompt(aprobar?'Respuesta opcional al empleado:':'Motivo del rechazo:','');
  if(respuesta===null) return;

  try{
    await api('adminResolverCorreccion',{
      correccionId:id,
      aprobar,
      respuesta
    });
    mostrarToast(aprobar?'Corrección aprobada':'Corrección rechazada');
    correcciones=await api('adminListCorrecciones');
    renderCorrecciones();
  }catch(e){mostrarToast(e.message,'err')}
}

async function cargarAdminInformes(){
  const emps=await api('adminListEmpleados');
  empleados=emps;

  const ahora=new Date();

  $('admin-informes').innerHTML =
    '<div class="card">'+
      '<div class="report-header">'+
        '<div><h2>Informes de jornada</h2><div class="muted small">Los datos se calculan directamente desde la hoja Fichajes.</div></div>'+
        '<div class="actions no-print"><button class="btn blue" onclick="imprimirInforme()">Imprimir / PDF</button><button class="btn" onclick="descargarPDFServidor()">Generar PDF</button></div>'+
      '</div>'+
      '<div class="toolbar no-print">'+
        '<div class="field"><label>Empleado</label><select id="informeEmpleado">'+
          emps.filter(e=>e.activo).map(e=>'<option value="'+e.id+'">'+escapeHtml(e.nombre)+' ('+escapeHtml(e.usuario)+')</option>').join('')+
        '</select></div>'+
        '<div class="field small-field"><label>Mes</label><select id="informeMes">'+
          Array.from({length:12},(_,i)=>'<option value="'+(i+1)+'" '+((i+1)===ahora.getMonth()+1?'selected':'')+'>'+nombreMes(i+1)+'</option>').join('')+
        '</select></div>'+
        '<div class="field small-field"><label>Año</label><select id="informeAnio">'+
          Array.from({length:5},(_,i)=>{const y=ahora.getFullYear()-2+i;return '<option value="'+y+'" '+(y===ahora.getFullYear()?'selected':'')+'>'+y+'</option>'}).join('')+
        '</select></div>'+
        '<button class="btn primary" onclick="generarInforme()">Generar informe</button>'+
      '</div>'+
    '</div>'+
    '<div id="informeResultado" style="margin-top:18px"></div>';

  await generarInforme();
}

function nombreMes(m){
  return ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][m-1];
}

async function generarInforme(){
  try{
    const empleadoId=$('informeEmpleado').value;
    const mes=Number($('informeMes').value);
    const anio=Number($('informeAnio').value);

    informeActual=await api('adminInforme',{
      empleadoId,mes,anio
    });

    renderInforme();
  }catch(e){mostrarToast(e.message,'err')}
}

function renderInforme(){
  const r=informeActual;
  const s=r.resumen;

  $('informeResultado').innerHTML =
    '<div class="card" id="reportPrintArea">'+
      '<div class="report-header">'+
        '<div><h2>'+escapeHtml(r.empleado.nombre)+'</h2><div class="muted">'+escapeHtml(nombreMes(r.periodo.mes)+' '+r.periodo.anio)+' · '+escapeHtml(r.empleado.usuario)+'</div></div>'+
        '<div>'+estadoPill(s.incidencias ? 'INCIDENCIA' : 'OK')+'</div>'+
      '</div>'+
      '<div class="report-kpis">'+
        '<div class="report-kpi"><div class="kpi-label">Horas</div><div class="value">'+s.horasTrabajadas.toFixed(2)+' h</div></div>'+
        '<div class="report-kpi"><div class="kpi-label">Pausas</div><div class="value">'+s.horasPausa.toFixed(2)+' h</div></div>'+
        '<div class="report-kpi"><div class="kpi-label">Días registrados</div><div class="value">'+s.diasConFichajes+'</div></div>'+
        '<div class="report-kpi"><div class="kpi-label">Completos</div><div class="value">'+s.diasCompletos+'</div></div>'+
        '<div class="report-kpi"><div class="kpi-label">Incidencias</div><div class="value">'+(s.incompletos+s.incidencias)+'</div></div>'+
      '</div>'+
      '<div id="reportChartWrap" style="margin-top:22px"><canvas id="reportChart"></canvas></div>'+
      '<div style="margin-top:22px" class="table-wrap">'+
        '<table class="report-table"><thead><tr><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Trabajo</th><th>Pausa</th><th>Estado</th><th>Incidencias</th></tr></thead><tbody>'+
        (r.dias.length ? r.dias.map(d=>{
          const entrada=d.eventos.find(e=>e.tipo==='entrada');
          const salida=d.eventos.filter(e=>e.tipo==='salida').slice(-1)[0];
          return '<tr>'+
            '<td>'+escapeHtml(d.fecha)+'</td>'+
            '<td>'+escapeHtml(entrada?.hora||'—')+'</td>'+
            '<td>'+escapeHtml(salida?.hora||'—')+'</td>'+
            '<td>'+Number(d.horas).toFixed(2)+' h</td>'+
            '<td>'+Number(d.horasPausa).toFixed(2)+' h</td>'+
            '<td>'+estadoPill(d.estado)+'</td>'+
            '<td>'+(d.anomalias.length ? d.anomalias.map(a=>'<div class="anomaly">'+escapeHtml(a)+'</div>').join('') : '<span class="muted">—</span>')+'</td>'+
          '</tr>';
        }).join('') : '<tr><td colspan="7" class="empty">No existen fichajes en este periodo.</td></tr>')+
        '</tbody></table>'+
      '</div>'+
      '<div class="muted small" style="margin-top:14px">Fuente: hoja Fichajes · cálculo realizado en servidor · zona horaria Europe/Madrid.</div>'+
    '</div>';

  dibujarGrafico(r);
}

function dibujarGrafico(r){
  const canvas=$('reportChart');
  if(!canvas) return;

  if(chart) chart.destroy();

  chart=new Chart(canvas,{
    type:'bar',
    data:{
      labels:r.dias.map(d=>d.fecha.slice(8)),
      datasets:[{
        label:'Horas trabajadas',
        data:r.dias.map(d=>d.horas)
      }]
    },
    options:{
      responsive:true,
      plugins:{
        legend:{display:false}
      },
      scales:{
        y:{beginAtZero:true,title:{display:true,text:'Horas'}}
      }
    }
  });
}

function imprimirInforme(){
  if(!informeActual) return;
  window.print();
}

async function descargarPDFServidor(){
  try{
    if(!informeActual) throw new Error('Genera primero un informe');

    const data=await api('adminResumenMensualPDF',{
      empleadoId:informeActual.empleado.id,
      mes:informeActual.periodo.mes,
      anio:informeActual.periodo.anio
    });

    const bytes=atob(data.base64);
    const arr=new Uint8Array(bytes.length);
    for(let i=0;i<bytes.length;i++) arr[i]=bytes.charCodeAt(i);

    const blob=new Blob([arr],{type:'application/pdf'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=data.nombreArchivo;
    a.click();
    URL.revokeObjectURL(url);

    mostrarToast('PDF generado');
  }catch(e){mostrarToast(e.message,'err')}
}

async function cargarAdminAuditoria(){
  auditoria=await api('adminAuditoria',{limite:500});

  $('admin-auditoria').innerHTML =
    '<div class="card">'+
      '<div class="toolbar">'+
        '<div class="field"><label>Buscar</label><input id="audBuscar" oninput="renderAuditoria()" placeholder="Acción, actor o detalle"></div>'+
        '<div class="field small-field"><label>Máximo</label><select id="audLimite" onchange="recargarAuditoria()"><option>100</option><option selected>500</option><option>1000</option></select></div>'+
      '</div>'+
      '<div id="audTabla"></div>'+
    '</div>';

  renderAuditoria();
}

async function recargarAuditoria(){
  try{
    auditoria=await api('adminAuditoria',{limite:Number($('audLimite').value)});
    renderAuditoria();
  }catch(e){mostrarToast(e.message,'err')}
}

function renderAuditoria(){
  const q=($('audBuscar')?.value||'').toLowerCase();

  const rows=auditoria.filter(a=>{
    const texto=[a.actorId,a.rol,a.accion,a.detalle].join(' ').toLowerCase();
    return !q||texto.includes(q);
  });

  $('audTabla').innerHTML =
    '<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Actor</th><th>Rol</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>'+
    (rows.length ? rows.map(a=>
      '<tr><td>'+escapeHtml(formatearFecha(a.timestamp))+'</td><td>'+escapeHtml(a.actorId)+'</td><td>'+escapeHtml(a.rol)+'</td><td>'+escapeHtml(a.accion)+'</td><td>'+escapeHtml(a.detalle||'')+'</td></tr>'
    ).join('') : '<tr><td colspan="5" class="empty">No hay registros.</td></tr>')+
    '</tbody></table></div>';
}

function formatearFecha(v){
  const d=new Date(v);
  return isNaN(d)?String(v):d.toLocaleString('es-ES',{dateStyle:'short',timeStyle:'medium'});
}
